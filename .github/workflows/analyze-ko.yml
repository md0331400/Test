name: Deep Analyze Kernel Module

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM64 analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Basic information
        run: |
          echo "===== FILE ====="
          file extracted.ko

          echo "===== MODINFO ====="
          modinfo ./extracted.ko || true

          echo "===== SIZE ====="
          ls -lh extracted.ko

      - name: Full symbols
        run: |
          readelf -Ws extracted.ko > symbols-full.txt

      - name: DWARF debug information
        run: |
          readelf --debug-dump=info extracted.ko > dwarf-info.txt || true
          readelf --debug-dump=decodedline extracted.ko > dwarf-lines.txt || true
          readelf --debug-dump=frames extracted.ko > dwarf-frames.txt || true

      - name: ARM64 disassembly
        run: |
          aarch64-linux-gnu-objdump -drwC extracted.ko > disassembly.txt

      - name: Relevant functions
        run: |
          grep -nE \
          "get_rand_str|translate_linear_address|read_physical_address|write_physical_address|read_process_memory|write_process_memory|get_module_base|dispatch_ioctl|dispatch_open|dispatch_close|init_module|cleanup_module" \
          symbols-full.txt dwarf-info.txt disassembly.txt \
          > relevant-functions.txt || true

      - name: Module strings
        run: |
          strings extracted.ko > strings-full.txt

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: kernel-module-deep-analysis
          path: |
            symbols-full.txt
            dwarf-info.txt
            dwarf-lines.txt
            dwarf-frames.txt
            disassembly.txt
            relevant-functions.txt
            strings-full.txt
